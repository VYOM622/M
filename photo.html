<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            position: relative;
            background-color: #282c34; /* Dark background for contrast */
        }
        .container {
            text-align: center;
            position: relative;
            z-index: 1; /* Ensure content is above background */
            padding: 20px; /* Add padding around the container */
            border: 2px solid #ff69b4; /* Border for the container */
            border-radius: 15px; /* Rounded corners */
            background-color: rgba(255, 255, 255, 0.9); /* Semi-transparent white background */
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3); /* Shadow effect */
            animation: float 3s ease-in-out infinite; /* Floating effect for the container */
        }
        .birthday-message {
            font-size: 3em; /* Increased font size */
            color: #FFD700; /* Gold color */
            margin: 20px 0; /* Add margin for spacing */
            animation: bounce 1s infinite; /* Bouncing effect */
        }
        .photo {
            width: 700px; /* Increased photo width */
            border-radius: 15px;
            margin-bottom: 20px; /* Space below the photo */
            animation: zoomIn 1s ease forwards; /* Zoom-in effect for the photo only */
        }
        .button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1.5em; /* Increased button font size */
            color: white;
            background-color: #ff69b4; /* Original button color */
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.3s, transform 0.3s; /* Added transform transition */
            animation: fadeIn 2s ease forwards; /* Fade-in effect for the button */
        }
        .button:hover {
            background-color: #28a745; /* Green hover color */
            transform: scale(1.1); /* Scale effect on hover */
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }
        @keyframes zoomIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        /* Background image */
        .background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://t3.ftcdn.net/jpg/06/27/85/70/360_F_627857047_VDETCsSfRkZuo5Fzdy3eHL1ZGdhsqYv9.jpg'); /* Updated Background image */
            background-size: cover;
            background-position: center;
            opacity: 0.8; /* Adjust opacity for effect */
            z-index: 0; /* Send background behind content */
        }
    </style>
</head>
<body>
    <div class="background-image"></div> <!-- Background image -->
    <div class="container">
        <img src="C:\Users\user\Desktop\00\12\12.jpg" alt="Happy Birthday" class="photo"> <!-- Increased photo area -->
        <div class="birthday-message">Happy Birthday, My Love!</div>
        <a href="birthday_wish.html" class="button">Back to Birthday Wish</a>
    </div>
</body>
</html>
