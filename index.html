<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Birthday Countdown Timer</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: 'Arial', sans-serif;
      color: #ffffff;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: url('https://raw.githubusercontent.com/VYOM622/M/main/1.jpg') no-repeat center center fixed;
      background-size: cover;
      overflow: hidden;
      position: relative;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 20px;
      text-shadow: 0 0 5px rgba(0,0,0,0.7);
      animation: fadeIn 2s ease forwards;
      position: relative;
      z-index: 2;
    }

    .countdown {
      font-size: 2.5em; /* Increased font size for better visibility */
      margin: 20px 0;
      animation: pulse 1.5s infinite;
      text-shadow: 0 0 6px rgba(0,0,0,0.8); /* Added text shadow for contrast */
      position: relative;
      z-index: 2;
    }

    .button {
      background-color: #4caf50;
      color: #ffffff;
      border: none;
      padding: 15px 30px;
      font-size: 1.2em;
      cursor: pointer;
      border-radius: 5px;
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
      text-decoration: none;
      display: inline-block;
      text-shadow: 0 0 3px rgba(0,0,0,0.6);
      position: relative;
      z-index: 2;
    }

    .button:hover {
      background-color: #66bb6a;
      box-shadow: 0 0 20px rgba(76, 175, 80, 0.8);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* Falling star styles */
    .falling-star {
      position: fixed;
      top: -10px;
      background: linear-gradient(45deg, white, rgba(255,255,255,0));
      opacity: 0.8;
      border-radius: 50%;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.8));
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
      animation-name: fall;
      animation-timing-function: linear;
      animation-iteration-count: 1;
      pointer-events: none;
      z-index: 1;
      transform: rotate(-45deg);
    }

    @keyframes fall {
      0% {
        transform: translateX(0) translateY(0) rotate(-45deg);
        opacity: 0.8;
      }
      80% {
        opacity: 0.8;
      }
      100% {
        transform: translateX(150vw) translateY(100vh) rotate(-45deg);
        opacity: 0;
      }
    }

    /* Popup overlay */
    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0,0,0,0.75);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }
    .popup-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    
    /* Popup box */
    .popup-box {
      background: #222;
      padding: 40px 60px;
      border-radius: 15px;
      box-shadow: 0 0 30px #4caf50, 0 0 60px #4caf50;
      text-align: center;
      color: #4caf50;
      font-size: 2em;
      font-weight: bold;
      font-family: 'Arial Black', Arial, sans-serif;
      user-select: none;
      position: relative;
      max-width: 90vw;
      box-sizing: border-box;
      line-height: 1.3;
    }

    /* Close button */
    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      background: transparent;
      border: none;
      font-size: 1.5em;
      color: #4caf50;
      cursor: pointer;
      font-weight: bold;
      line-height: 1;
      transition: color 0.3s ease;
    }
    .close-btn:hover {
      color: #76ff03;
    }

    /* Pause button */
    #pauseAudio {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 3;
      padding: 5px;
      font-size: 1.5em;
      background: transparent;
      border: none;
      cursor: pointer;
      color: #ffffff;
    }

    /* Responsive styles */
    @media (max-width: 600px) {
      h1 {
        font-size: 2em;
      }
      .countdown {
        font-size: 1.5em;
      }
      .button {
        padding: 10px 20px;
        font-size: 1em;
      }
      .popup-box {
        font-size: 1.5em;
        padding: 30px 40px;
      }
    }
  </style>
</head>
<body>
  <div>
    <h1 role="heading" aria-level="1">Birthday Countdown Timer</h1>
    <div class="countdown" id="countdown" aria-live="polite">00d 00h 00m 00s</div>
    <a href="birthday_wish.html" class="button" id="birthdayButton" role="button" aria-label="Wish Happy Birthday My Love">Happy Birthday My Love</a>
  </div>
  
  <audio id="background-audio" autoplay loop>
        <source src="https://raw.githubusercontent.com/VYOM622/M/main/X.mp3" type="audio/mpeg"> 
        Your browser does not support the audio element.
  </audio>
  
  <!-- Pause Button with Symbol -->
  <button id="pauseAudio" role="button" aria-label="Pause Background Music">⏸️</button>

  <!-- Existing Popup Element -->
  <div class="popup-overlay" id="popup" role="dialog" aria-labelledby="popupTitle" aria-hidden="true">
    <div class="popup-box">
      <button class="close-btn" id="closePopup" aria-label="Close popup">&times;</button>
      <div id="popupTitle">🎉 Happy Birthday Mitu (Awesome)! 🎉</div>
    </div>
  </div>
  
  <!-- New Conditional Popup Element -->
  <div class="popup-overlay" id="waitPopup" role="dialog" aria-labelledby="waitPopupTitle" aria-hidden="true">
    <div class="popup-box">
      <button class="close-btn" id="closeWaitPopup" aria-label="Close popup">&times;</button>
      <div id="waitPopupTitle">⏳ Wait for a while, your birthday is a few moments away from you.<br><br>❤️ I love you... by VYOM</div>
    </div>
  </div>

  <script>
    // Birthday date and variables
    const birthdayDate = new Date("2025-05-04T00:00:00").getTime();
    const countdownEl = document.getElementById("countdown");
    const birthdayBtn = document.getElementById("birthdayButton");
    const popup = document.getElementById("popup");
    const closeBtn = document.getElementById("closePopup");
    const waitPopup = document.getElementById("waitPopup");
    const closeWaitBtn = document.getElementById("closeWaitPopup");

    let timeLeft = birthdayDate - new Date().getTime();

    // Countdown interval
    const countdownFunction = setInterval(() => {
        const now = new Date().getTime();
        timeLeft = birthdayDate - now;

        // Time calculations
        const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
        const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

        // Display countdown or birthday message
        if (timeLeft > 0) {
          countdownEl.innerHTML = `${days}d ${hours}h ${minutes}m ${seconds}s`;
        } else {
          clearInterval(countdownFunction);
          countdownEl.innerHTML = "Happy Birthday!";
        }
    }, 1000);

    // Audio controls
    const audioElement = document.getElementById('background-audio');
    const pauseButton = document.getElementById('pauseAudio');
    pauseButton.addEventListener('click', () => {
        if (audioElement.paused) {
            audioElement.play();
            pauseButton.innerHTML = '⏸️'; // pause symbol
        } else {
            audioElement.pause();
            pauseButton.innerHTML = '▶️'; // play symbol
        }
    });
    audioElement.volume = 0.1;

    // Birthday button click handler with updated condition:
    // Navigate to next page only if timer ≤ 4 seconds (>=0 and ≤4000 ms)
    // Else show waitPopup
    birthdayBtn.addEventListener('click', (e) => {
      const now = new Date().getTime();
      const currentLeft = birthdayDate - now;
      
      if (currentLeft > 4000) {
        // Prevent navigation
        e.preventDefault();
        showWaitPopup();
      } else {
        // Allow navigation: do nothing, link will work
      }
    });

    // Popup show/hide functions
    function showPopup() {
      popup.classList.add('show');
      popup.setAttribute('aria-hidden', 'false');
    }
    function hidePopup() {
      popup.classList.remove('show');
      popup.setAttribute('aria-hidden', 'true');
    }
    function showWaitPopup() {
      waitPopup.classList.add('show');
      waitPopup.setAttribute('aria-hidden', 'false');
    }
    function hideWaitPopup() {
      waitPopup.classList.remove('show');
      waitPopup.setAttribute('aria-hidden', 'true');
    }

    // Close popup event listeners
    closeBtn.addEventListener('click', hidePopup);
    closeWaitBtn.addEventListener('click', hideWaitPopup);

  </script>
</body>
</html>
