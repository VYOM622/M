<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Wishes</title>
    <style>
        body {
            background: url('https://www.transparenttextures.com/patterns/wood-pattern.png');
            color: #333333;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Full height for PC view */
            margin: 0;
            text-align: center;
            position: relative;
            overflow: hidden;
            opacity: 0;
            animation: fadeIn 1s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        h1 {
            font-size: 3em; /* Larger font size for PC */
            margin-bottom: 20px;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }

        p {
            font-size: 1.5em; /* Larger font size for PC */
            margin-bottom: 40px;
            animation: fadeIn 1s forwards;
            animation-delay: 0.5s;
        }

        .link {
            background-color: #4caf50;
            color: #ffffff;
            border: none;
            padding: 15px 30px; /* Increased padding for PC */
            font-size: 1.2em; /* Larger font size for PC */
            cursor: pointer;
            border-radius: 5px;
            text-decoration: none;
            transition: background-color 0.3s, transform 0.3s;
            display: inline-block;
            margin: 10px;
            animation: fadeIn 1s forwards;
            animation-delay: 1s;
        }

        .link:hover {
            background-color: #66bb6a;
            transform: scale(1.1) rotate(2deg);
            animation: shake 0.5s;
        }

        @keyframes shake {
            0% { transform: translate(0); }
            25% { transform: translate(-5px); }
            50% { transform: translate(5px); }
            75% { transform: translate(-5px); }
            100% { transform: translate(0); }
        }

        .star {
            position: absolute;
            width: 15px;
            height: 15px;
            background-color: #ffcc00;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            opacity: 0.6;
            animation: moveUpAndDown 3s infinite;
        }

        @keyframes moveUpAndDown {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <audio id="background-audio" autoplay loop>
